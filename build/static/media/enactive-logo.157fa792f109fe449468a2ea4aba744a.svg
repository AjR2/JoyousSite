<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 30" fill="none">
  <!-- Edges -->
  <line x1="11" y1="7" x2="3"  y2="23" stroke="currentColor" stroke-width="1"   opacity="0.35"/>
  <line x1="11" y1="7" x2="21" y2="23" stroke="currentColor" stroke-width="1"   opacity="0.35"/>
  <line x1="3"  y1="23" x2="21" y2="23" stroke="currentColor" stroke-width="0.8" opacity="0.2" stroke-dasharray="2.5 2"/>

  <!-- Nodes -->
  <circle cx="11" cy="7"  r="3" fill="#2563EB"/>
  <circle cx="3"  cy="23" r="2" fill="currentColor" opacity="0.55"/>
  <circle cx="21" cy="23" r="2" fill="currentColor" opacity="0.55"/>

  <!-- Wordmark -->
  <text x="30" y="21"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15.5"
    font-weight="600"
    letter-spacing="0.03em">
    <tspan fill="currentColor">en</tspan><tspan fill="#2563EB">act</tspan><tspan fill="currentColor">ive</tspan>
  </text>
</svg>
